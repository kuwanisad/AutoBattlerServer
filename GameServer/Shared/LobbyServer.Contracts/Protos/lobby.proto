syntax = "proto3";

import "common.proto";

option csharp_namespace = "LobbyServer";

// 클라이언트와 로비 서버 간 gRPC 계약.
// 현업 패턴에 따라 용도별로 RPC 타입을 분리한다.
// - 단항 RPC: 요청/응답이 명확한 것 (계정 생성 등)
// - 서버 스트리밍: 서버가 지속적으로 상태를 밀어주는 것 (매치메이킹)
//
// 인증: 모든 RPC가 gRPC 메타데이터에 "authorization: Bearer {token}"을 포함해야 한다.
// AuthInterceptor가 자동으로 검증한다.
//
// Login/CreateAccount는 코드에서 제거됐다 - 별도 "로그인 서버"로 분리하는 게 맞는
// 방향이지만 그건 나중 작업이고, 지금은 EnterLobby부터 토큰이 필요한 임시 상태다.
// 클라는 최초 접속 시 스스로 만든(사실상 playerId 그대로인) 토큰을 제출하고,
// EnterLobby가 성공하면 그 자리에서 새 토큰을 발급해 돌려준다(EnterLobbyResponse.token).
// DummyTokenProvider가 지금은 어떤 토큰이든 통과시키므로 사실상 신원 검증은 없는
// 상태 - 로그인 서버가 생기기 전까지의 임시 조치.
//
// 매칭 서버 → 로비 서버 콜백(매칭 확정/취소 통보)은 여기 없다 - 로비가
// MatchingServer.Contracts의 MatchConnectionControl.Connect 스트림으로 매칭 서버에
// 접속을 유지하고, 그 스트림으로 MatchNotification을 직접 받는다. 별도 RPC나
// 주소 조회가 필요 없다 (MatchServerConnection/MatchNotificationDispatcher 참고).

service LobbyControl {
  // === 세션 ===
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // 클라가 접속 직후(또는 다른 서버에서 넘어온 직후) 호출한다. 이 로비가 플레이어 관리
  // 권한을 가져올 수 있는지 확인한다. 다른 서버(주로 인게임)가 아직 살아있는 채로 권한을
  // 갖고 있으면 거부되고, 그 서버 주소를 돌려준다 - 클라는 이걸로 "진행 중인 게임이
  // 있습니다" 안내를 띄울 수 있다. 성공하면 새 토큰을 발급해서 함께 돌려준다.
  rpc EnterLobby(EnterLobbyRequest) returns (EnterLobbyResponse);

  // EnterLobby 성공 직후 클라가 연다. 내용을 주고받을 필요는 없고, 이 연결이 살아있다는
  // 사실 자체가 "클라가 아직 로비에 있다"는 증거다 - 하트비트 메시지 없이, 스트림이
  // 끊기는 순간을 서버가 즉시 감지해서 세션을 정리한다(단, 그 순간 이미 다른 서버로
  // 넘어가는 중이었다면 - Status가 Moving으로 바뀌어 있으면 - 정상적인 이동이므로
  // 건드리지 않는다). 로비는 반응성이 필요 없는 서버라 주기적 하트비트 대신 이 방식이
  // 더 가볍다(클라 수만큼 반복 발생하는 메시지가 없음).
  rpc StayConnected(StayConnectedRequest) returns (stream StayConnectedEvent);

  // === 우편함 ===
  // 하위 서버가 "이 플레이어 우편함이 갱신됐다"는 신호만 보낸다(내용은 안 실림) -
  // 로비가 직접 AccountServer한테 최신 목록을 조회해서 StayConnected 스트림으로
  // 밀어준다. 그 순간 이 로비에 접속 중이 아니면 success=false - 하위 서버는 이걸
  // "실패"로 취급 안 해도 된다(다음 접속 시 자동 제공이 안전망이므로).
  rpc NotifyMailUpdated(NotifyMailUpdatedRequest) returns (NotifyMailUpdatedResponse);

  // 클라가 능동적으로 최신 우편함을 요청한다(새로고침 등). 응답은 StayConnected로
  // push되는 것과 같은 MailProvided를 그대로 재사용한다.
  rpc GetMailList(GetMailListRequest) returns (MailProvided);

  // 상대 서버(게임 에이전트)가 "이 플레이어들이 곧 로비로 올 것"이라며 일회용 임시
  // 티켓을 미리 등록한다 - 훔친 영구 토큰으로 진짜 클라보다 먼저 도착하는 걸 막기 위함
  // (KNOWN_ISSUES.md 참고).
  rpc RegisterIncomingTransfers(RegisterIncomingTransfersRequest) returns (RegisterIncomingTransfersResponse);

  // === 매치메이킹 ===
  // 매치 요청 후 서버가 상태 업데이트를 스트림으로 밀어준다.
  // 매치 확정 시 MatchEvent.match_found를 마지막으로 스트림이 닫힌다.
  rpc RequestMatch(MatchRequest) returns (stream MatchEvent);
  rpc CancelMatch(CancelMatchRequest) returns (CancelMatchResponse);

  // === 친구 관리 ===
  // 클라를 직접 상대하는 메인 서버(로비, 나중에 인게임도)의 창구 - 계정 서버의 실제
  // 저장소를 대리 호출한다. 채팅 서버는 이 창구를 거치지 않는다(자기가 친구인지 스스로
  // 판단 안 함 - "서비스 제공 가능 여부는 전적으로 메인 서버한테 맡긴다"는 원칙).
  rpc GetFriends(GetFriendsRequest) returns (GetFriendsResponse);
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
}

// === 세션 ===

message LogoutRequest {}

message LogoutResponse {
  bool success = 1;
}

message EnterLobbyRequest {
  // 서버 이동 시 발급된 일회용 임시 티켓. 최초 로그인 직후 첫 EnterLobby는 티켓 없이
  // 온다(로그인 서버가 이관하는 경우 - 아직 이 메커니즘 대상이 아님). 인게임에서
  // 돌아오는 경우에만 채워져 있고, 검증 대상이 된다.
  string transfer_ticket = 1;
}

message StayConnectedRequest {}

// 내용 없음 - 스트림이 살아있다는 사실 자체가 목적이라 실제로 이벤트를 보낼 필요가
// 거의 없다. 우편함 제공(MailProvided)이 지금 유일하게 이 스트림을 실제로 쓰는 경우.
message StayConnectedEvent {
  oneof payload {
    MailProvided mail_provided = 1;
    AnnouncementDelivery announcement = 2;
  }
}

message AnnouncementDelivery {
  AnnouncementType announcement_type = 1;
}

message NotifyMailUpdatedRequest {
  string player_id = 1;
}

message NotifyMailUpdatedResponse {
  bool success = 1; // 그 클라가 지금 이 로비에 접속 중이어서 신호를 실제로 전달했는지
}

// playerId는 인증 컨텍스트(토큰)에서 가져온다 - GetFriends 등과 같은 패턴.
message GetMailListRequest {}

message RegisterIncomingTransfersRequest {
  repeated PlayerTicket tickets = 1;
}

message PlayerTicket {
  string player_id = 1;
  string ticket = 2;
}

message RegisterIncomingTransfersResponse {
  bool success = 1;
}

// account.proto의 MailSummary와 필드가 같아야 한다(JSON이 아니라 gRPC라 타입을 그대로
// 재사용할 수도 있었지만, 계정 서버와 로비 서버가 서로의 내부 타입을 참조할 필요가
// 없게 - FriendRemovedEvent 때와 같은 이유로 로컬에 따로 둔다).
message MailProvided {
  repeated MailInfo mails = 1;
}

message MailInfo {
  string mail_id = 1;
  MailType mail_type = 2;
  string display_content = 3;
  int64 created_at_unix_ms = 4;
  int64 expires_at_unix_ms = 5;
  bool claimed = 6;
}

message EnterLobbyResponse {
  bool success = 1;
  string error_message = 2;

  // success = false이고 이게 true면, 다른 서버가 아직 이 플레이어를 살아서 소유 중이라는 뜻.
  bool has_conflicting_session = 3;
  string conflicting_server_address = 4;  // 클라가 "진행 중인 게임이 있습니다" 안내에 쓸 주소

  // success = false이고 이게 true면, 너무 자주 호출해서 서버가 남용 방지로 거부한 것.
  // has_conflicting_session이랑은 별개 사유 - 클라는 이 경우 그냥 잠시 후 재시도하면 된다.
  bool rate_limited = 5;

  // success = true일 때 - 새로 발급된 토큰. 클라는 이후 요청(그리고 다음 서버 이동 시
  // EnterLobby)에 이 값을 써야 한다.
  string token = 6;
}

// === 매치메이킹 ===

message MatchRequest {
  GameType game_type = 1;
}

message MatchEvent {
  oneof payload {
    MatchQueued queued = 1;       // 대기열 진입 확인
    MatchStatusUpdate status = 2; // 대기 중 상태 업데이트
    MatchFound match_found = 3;   // 매치 확정 - 이후 스트림이 닫힘
    MatchFailed match_failed = 4; // 매치 실패
  }
}

message MatchQueued {
  int32 queue_position = 1;
  int64 estimated_wait_ms = 2;
}

message MatchStatusUpdate {
  int32 queue_position = 1;
  int64 estimated_wait_ms = 2;
}

message MatchFound {
  string match_id = 1;
  string game_server_address = 2;   // 클라이언트가 NGO로 접속할 주소 (host:port)
  repeated string player_ids = 3;   // 같은 매치의 플레이어 목록
  string ingame_server_id = 4;      // OwnerServerId 설정에 사용
  int64 timestamp_unix_ms = 5;
  string transfer_ticket = 6;       // ConnectionApproval 제출용 일회용 임시 티켓
}

message MatchFailed {
  string reason = 1;
}

message CancelMatchRequest {}

message CancelMatchResponse {
  bool success = 1;
}

// === 친구 관리 ===
// playerId는 토큰에서 인증된 값을 그대로 쓴다(context.UserState) - 요청 메시지에
// 자기 자신의 playerId를 안 담는 이유.

message GetFriendsRequest {}

message GetFriendsResponse {
  repeated string friend_player_ids = 1;
}

message AddFriendRequest {
  string friend_player_id = 1;
}

message AddFriendResponse {
  bool success = 1;
  string error_message = 2;
}

message RemoveFriendRequest {
  string friend_player_id = 1;
}

message RemoveFriendResponse {
  bool success = 1;
  string error_message = 2;
}
