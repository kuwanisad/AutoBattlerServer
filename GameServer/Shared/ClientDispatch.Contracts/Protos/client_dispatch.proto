syntax = "proto3";

import "lobby.proto";
import "chat.proto";

option csharp_namespace = "ClientDispatch";

// 네트워크로 나가지 않는 순수 메시지 정의 - 클라(Unity) 내부에서 백그라운드 스레드가
// 메인 스레드로 이벤트를 넘길 때만 쓰는 태그드 유니언. gRPC 서비스 없음(RPC 대상 아님,
// MainThreadDispatcher가 큐에 담는 용도로만 씀). 서버(게임 에이전트↔Unity 서버)용은
// 별도로 분리 - 배포 시 클라/서버 바이너리가 나뉘므로, 하나로 합쳐두면 서버 내부
// 이벤트 구조를 클라 빌드에서 추측할 여지를 준다고 판단.
//
// 원본 gRPC 응답 메시지(MatchFound 등)를 그대로 담는다 - 별도 DTO로 변환하는 계층을
// 안 두는 이유는, 캐스팅 비용을 없애기 위해 oneof(PayloadCase, 정수 비교)로 타입을
// 구분하고 싶어서다. object + is 타입 검사보다 이쪽이 저렴하다.
message ClientDispatchEvent {
  oneof payload {
    MatchFound match_found = 1;
    // 채팅 - 필터링(방금 삭제 통보받은 채널의 새는 메시지 버리기 등)은 여전히
    // WebSocketChatChannel.HandleMessage가 백그라운드에서 판단한다(순수 C# 상태
    // 조작이라 유니티 API 접근이 아님) - 그 판단이 끝난 뒤 "필터를 통과한 원본
    // 메시지"만 여기 담아 넘긴다.
    ChatMessageDelivery chat_message = 2;
    SystemChatDelivery chat_system_message = 3;
    RoomInvited room_invited = 4;
    RoomRemoved room_removed = 5;
    AnnouncementDelivery announcement = 6;
  }
}

