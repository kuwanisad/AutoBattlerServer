syntax = "proto3";

import "common.proto";

option csharp_namespace = "LoginServer";

// 클라이언트 최초 접속 전용 서버. 로그인 성공 후 손을 떼면 클라는 다시 이 서버로
// 돌아오지 않는다 - JWT/재접속 개념 자체가 없다. 연결이 끊기면(어느 단계에서든) 그냥
// 끊긴 걸로 끝, 복구/재시도 로직 없음.
//
// 스트림을 쓰는 이유: "일정 시간 안에 계정 정보를 제출 안 하면 연결을 끊는다"를
// 구현하려면 서버가 "접속은 됐지만 아직 제출 전"이라는 상태를 들고 있어야 하는데,
// 단항 RPC로는 그 상태 자체가 없다(호출 안 하면 그냥 아무 일도 안 일어남).
// MasterControl.Connect와 같은 패턴.
//
// 메시지는 최대한 작게 유지한다 - 계정 정보가 반려당하는 경우가 잦은 절차라서다.
service LoginControl {
  rpc Connect(stream ClientToLoginMessage) returns (stream LoginToClientMessage);
}

message ClientToLoginMessage {
  oneof payload {
    Credentials credentials = 1;
    ReconnectRequest reconnect = 2;
    CreateAccountRequest create_account = 3;
  }
}

message Credentials {
  string account_id = 1;
  string password = 2;
}

// 클라가 명시적으로 "계정을 새로 만들어달라"고 요청할 때 쓴다(Credentials와 분리 -
// 예전엔 Credentials로 로그인 시도했다가 계정이 없으면 같은 정보로 자동 생성해버렸는데,
// 그러면 닉네임을 입력받을 지점이 없었다). 계정 ID/닉네임이 이미 있으면 거부된다
// (AccountServer.CreateAccount가 둘 다 검사). 성공하면 그 즉시 로그인 성공으로
// 간주하고 Credentials 로그인과 완전히 같은 절차(세션 클레임 → 로비 이관 → 리다이렉트)를
// 탄다.
message CreateAccountRequest {
  string account_id = 1;
  string password = 2;
  string nickname = 3;
}

// 갈 곳을 잃은 클라가 자격증명 재입력 없이 재진입을 시도할 때 쓴다(KNOWN_ISSUES.md
// 참고 - 로그인 서버가 "안정적 단일 조회 창구" 역할을 겸함). player_id는 토큰
// 문자열에서 뽑아내는 게 아니라 클라가 별도로 캐시해둔 값을 그대로 보낸다 - 세션이
// 살아있을 때만 이 값과 토큰을 세션의 실제 기록과 대조하므로, 세션이 없으면(=
// 대조할 대상 자체가 없으면) 이 요청은 무조건 거부되고 자격증명으로 처음부터
// 다시 로그인해야 한다(토큰 문자열만으로 신원을 주장하게 허용하면 검증 불가능한
// 사칭 구멍이 생기므로 - 세션 없이는 절대 통과시키지 않음).
message ReconnectRequest {
  string player_id = 1;
  string token = 2;
}

message LoginToClientMessage {
  oneof payload {
    LoginRedirect redirect = 1;   // 성공 - 이 로비 주소로 이동하라
    LoginRejected rejected = 2;   // 실패 - 사유 포함, 이후 스트림 종료
  }
}

message LoginRedirect {
  // 최초 로그인 시엔 항상 로비 주소. 재진입(ReconnectRequest) 응답일 땐 destination_type에
  // 따라 로비 또는 인게임 서버 주소일 수 있음(이미 있던 필드를 재사용 - 이름은
  // 그대로 두되 의미가 확장됨).
  string lobby_address = 1;
  string player_id = 2;  // 클라가 이후 로비 요청 시 필요 (playerId 자체를 알아야 하는
                          // 화면/로직이 있을 수 있음)
  string token = 3;       // 로그인 서버가 발급한 초기 토큰. 이제 토큰 ≠ playerId(무작위
                           // 값)라 별도로 내려줘야 한다 - 클라는 이후 로비에서 EnterLobby를
                           // 부를 때 이 값을 Bearer 토큰으로 쓴다.
  string chat_address = 4;  // 채팅 서버 주소. 예전엔 클라 인스펙터에 고정값으로 박혀있었는데,
                             // 다른 서버 주소들과 일관되게 여기서 동적으로 내려준다 - 배포
                             // 유연성(채팅 서버 주소가 바뀌어도 클라 재배포 불필요) +
                             // 로그인 전엔 이 주소 자체를 몰라도 되는 부가적 이점.

  // 재진입 응답에서만 의미 있음(최초 로그인 응답은 항상 Lobby) - lobby_address가
  // 실제로 로비인지 인게임 서버인지 클라가 구분해서 그에 맞는 접속 절차(EnterLobby
  // vs NGO ConnectionApproval)를 밟을 수 있게 함. 별도 enum 대신 common.proto의
  // ServerType을 그대로 재사용 - 의미가 완전히 같은 걸 새로 안 만듦.
  ServerType destination_server_type = 5;

  // 최초 로그인(Credentials/CreateAccountRequest) 응답에서만 채워진다 - 계정 생성
  // 시에만 입력받고 그 뒤로 안 바뀌는 값이라(account.proto 참고), 클라가 이 한 번을
  // 받으면 재접속(ReconnectRequest) 응답에서는 다시 안 줘도 된다(클라가 이미 들고
  // 있으므로) - 그래서 HandleReconnectAsync 쪽 LoginRedirect엔 이 필드를 안 채운다.
  string nickname = 6;
}

// 로그인 거부 사유(enum 규칙은 common.proto 참고).
enum LoginRejectReason {
  LOGIN_REJECT_REASON_UNSPECIFIED = 0;
  // 계정/비번 불일치 또는 그 계정 자체가 없음 - Credentials 로그인은 더 이상 자동으로 계정을
  // 만들지 않는다(CreateAccountRequest를 따로 보내야 함). 어느 쪽인지는 클라에 알려주지 않는다
  // (남의 계정 ID 존재 여부 확인에 악용되지 않게) - 서버 로그에만 남긴다.
  LOGIN_REJECT_REASON_INVALID_CREDENTIALS = 1;
  // CreateAccountRequest인데 ID/닉네임 중복 등으로 생성 실패 - 정확한 사유는 서버 로그에만.
  LOGIN_REJECT_REASON_ACCOUNT_CREATION_FAILED = 2;
  LOGIN_REJECT_REASON_SESSION_CONFLICT = 3;     // 이미 다른 서버가 이 플레이어를 살아서 소유 중
  LOGIN_REJECT_REASON_NO_LOBBY_AVAILABLE = 4;   // 매칭 서버가 갈 수 있는 로비를 못 찾음("서버가 가득 찼습니다")
  LOGIN_REJECT_REASON_TIMEOUT = 5;              // 제한 시간 안에 계정 정보 미제출
  LOGIN_REJECT_REASON_INTERNAL_ERROR = 6;       // 그 외 내부 오류
  // ReconnectRequest인데 살아있는 소유 세션이 없음 - 자격증명으로 처음부터 다시 로그인해야 함.
  LOGIN_REJECT_REASON_NO_ACTIVE_SESSION = 7;
  LOGIN_REJECT_REASON_INVALID_TOKEN = 8;        // ReconnectRequest인데 토큰이 세션과 불일치
}

message LoginRejected {
  LoginRejectReason reason = 1;
  string detail = 2;  // 로그/디버그용 설명(화면에 표시하지 않음)
}
