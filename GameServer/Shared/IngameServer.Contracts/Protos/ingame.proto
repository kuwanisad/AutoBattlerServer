syntax = "proto3";

import "common.proto";

option csharp_namespace = "IngameServer";

// 게임 서버(Unity NGO)와 게임 에이전트(.NET 8) 간 양방향 스트림.
// 게임 에이전트가 gRPC 서버, 게임 서버가 gRPC 클라이언트다.
//
// 설계 원칙:
// - 어떤 메시지든 수신 자체가 생존 신호 (idle heartbeat 패턴)
// - 게임 에이전트는 게임 서버로부터 확인을 받은 후에만 마스터에 보고한다
// - 하트비트는 양방향으로 주고받는다

service IngameControl {
  // 게임 서버가 게임 에이전트에 연결하는 양방향 스트림.
  // 연결 자체가 "게임 서버가 살아있다"는 신호다.
  rpc Connect(stream GameServerMessage) returns (stream GameAgentMessage);

  // 하위 서버가 "이 플레이어 우편함이 갱신됐다"는 신호를 보내면, 게임 에이전트가 지금
  // 이 플레이어가 자기가 담당하는 게임 서버(Unity)에 접속 중인지 확인하고, 있으면
  // GameServerMessage 스트림으로 릴레이한다(로비의 StayConnected와 같은 역할, 통로만
  // 다름). 게임 에이전트는 게임 서버 하나랑만 붙는 사이드카 구조라 "여러 연결 중에
  // 찾기"는 필요 없다.
  rpc NotifyMailUpdated(NotifyMailUpdatedRequest) returns (NotifyMailUpdatedResponse);

  // 상대 서버(로비)가 "이 플레이어들이 곧 인게임으로 올 것"이라며 일회용 임시 티켓을
  // 미리 등록한다 - 로비의 RegisterIncomingTransfers와 대칭.
  rpc RegisterIncomingTransfers(RegisterIncomingTransfersRequest) returns (RegisterIncomingTransfersResponse);
}

message NotifyMailUpdatedRequest {
  string player_id = 1;
}

message NotifyMailUpdatedResponse {
  bool success = 1; // 그 클라가 지금 이 게임 에이전트 관할에 접속 중이어서 릴레이했는지
}

message RegisterIncomingTransfersRequest {
  repeated PlayerTicket tickets = 1;
}

message PlayerTicket {
  string player_id = 1;
  string ticket = 2;
}

message RegisterIncomingTransfersResponse {
  bool success = 1;
}

// === 게임 서버 → 게임 에이전트 ===

message GameServerMessage {
  oneof payload {
    GameServerHeartbeat heartbeat = 1;              // 생존 신호
    GameServerStatus status = 2;                    // 부하/수용량 상태 보고
    ServerReady ready = 3;                          // 게임 서버 준비 완료
    RoomOpened room_opened = 4;                     // 방 열기 완료 확인
    MatchResult match_result = 5;                   // 매치 결과
    PlayerJoined player_joined = 6;                 // 플레이어 접속
    PlayerLeft player_left = 7;                     // 플레이어 퇴장
    ApprovalRequest approval_request = 8;           // ConnectionApproval 검증 요청
    RoomTimeout room_timeout = 9;                   // 방-채움 타임아웃 - 자체 감지한 결원 보고
    FriendCommandRequest friend_command = 10;       // 인게임 중 친구 관리 명령어 릴레이
    GetMailListRequest get_mail_list = 11;           // 인게임 중 클라의 능동적 우편함 조회 요청
  }
}

// 내용 없이 메시지가 왔다는 사실 자체가 생존 신호다.
message GameServerHeartbeat {}

message GameServerStatus {
  int32 current_load = 1;   // 현재 활성 매치 수
  int32 capacity = 2;       // 수용 가능한 최대 매치 수
  int64 timestamp_unix_ms = 3;
}

// 게임 서버가 완전히 준비됐음을 알린다.
// 게임 에이전트는 이 메시지를 받은 후에만 마스터에 "준비 완료"를 보고한다.
message ServerReady {
  int32 capacity = 1;       // 수용 가능한 최대 매치 수
  int64 timestamp_unix_ms = 2;
  string client_address = 3;  // 클라이언트가 NGO로 접속할 주소(host:port) - 게임 에이전트
                               // 자신의 gRPC 주소(SelfAddress)와는 다르다. 매칭 서버가
                               // 로비/클라에 돌려줄 인게임 서버 주소는 이 값이어야 한다.
}

// 게임 에이전트의 OpenRoom 요청에 대한 확인 응답.
// 게임 에이전트는 이 메시지를 받은 후에만 마스터에 "방 열었다"고 보고한다.
message RoomOpened {
  string room_id = 1;
  bool success = 2;
  string error_message = 3;  // success = false인 경우 원인
}

message MatchResult {
  string match_id = 1;
  repeated PlayerMatchResult players = 2;
  int64 started_at_unix_ms = 3;
  int64 finished_at_unix_ms = 4;
}

message PlayerMatchResult {
  string player_id = 1;
  int32 rank = 2;
  bool is_winner = 3;
  int32 score_earned = 4;
}

message PlayerJoined {
  string player_id = 1;
  string room_id = 2;
  int64 timestamp_unix_ms = 3;
}

message PlayerLeft {
  string player_id = 1;
  string room_id = 2;
  int64 timestamp_unix_ms = 3;
}

// NGO ConnectionApproval 시 게임 서버가 게임 에이전트에 검증을 요청한다.
// 게임 에이전트가 Redis에서 세션을 조회해 OwnerServerId 기준으로 검증 후 ApprovalResponse로 응답한다.
// (예전에는 matchToken도 같이 검증했으나, 매칭 서버가 게임 에이전트에 플레이어 명단을
// 직접 전달하게 되면서 OwnerServerId 검증만으로 충분해져 폐지했다.)
message ApprovalRequest {
  uint64 client_id = 1;      // NGO 클라이언트 ID
  string player_id = 2;     // 클라이언트가 주장하는 플레이어 ID
  string token = 3;         // 클라가 마지막으로 받은 토큰 - 세션의 CurrentToken/PreviousToken과
                             // 대조해서 진짜 본인인지 검증하는 데 쓴다 (TokenVerification 참고)
  string transfer_ticket = 4; // 로비→인게임 이동 시 발급된 일회용 임시 티켓 (KNOWN_ISSUES.md 참고)
}

// 인게임 중 클라가 친구 관리(조회/추가/삭제)를 명령어로 요청하면, 인게임 서버가 이걸로
// 릴레이한다. 로비의 GetFriends/AddFriend/RemoveFriend와 같은 역할이지만 클라가 인게임에
// 붙어있는 동안 요청하는 경로 - "친구 관리는 지금 클라를 상대하는 메인 서버의 창구"
// 원칙에 따라 인게임 서버는 판단 없이 릴레이만 하고, 실제 처리는 게임 에이전트가
// AccountServer를 호출해서 담당한다.
//
// player_id는 클라가 자체 신고한 값을 신뢰하지 않는다 - 인게임 서버가 ConnectionApproval
// 때 이미 검증해둔 값으로 덮어써서 여기 채운다(클라 쪽 CustomMessagingManager 페이로드에는
// player_id 필드 자체가 없다 - KNOWN_ISSUES.md #9와 같은 이유).
message FriendCommandRequest {
  uint64 client_id = 1;   // 어느 NGO 클라이언트의 요청인지 - 응답을 돌려줄 대상 특정용
  string player_id = 2;   // 인게임 서버가 검증해서 채운 값
  oneof command {
    GetFriendsCommand get_friends = 3;
    AddFriendCommand add_friend = 4;
    RemoveFriendCommand remove_friend = 5;
  }
}

message GetFriendsCommand {}

message AddFriendCommand {
  string friend_player_id = 1;
}

message RemoveFriendCommand {
  string friend_player_id = 1;
}

// 응답은 별도 타입 없이 이미 있는 GameAgentMessage.MailProvided를 그대로 재사용한다 -
// 접속 시 자동 제공/하위 서버 신호 즉시 제공과 완전히 같은 응답 모양이라 새로 만들
// 필요가 없다.
message GetMailListRequest {
  uint64 client_id = 1;   // 어느 NGO 클라이언트의 요청인지
  string player_id = 2;   // 인게임 서버가 검증해서 채운 값(클라 자체 신고 신뢰 안 함)
}

// === 게임 에이전트 → 게임 서버 ===

message GameAgentMessage {
  oneof payload {
    GameAgentHeartbeat heartbeat = 1;  // 생존 신호
    OpenRoom open_room = 2;            // 방 열기 요청
    DrainSignal drain = 3;             // 마스터의 드레인 신호 릴레이
    ApprovalResponse approval_response = 4;  // ConnectionApproval 검증 응답
    CloseRoom close_room = 5;          // 방 취소/제거 요청
    FriendCommandResponse friend_command_result = 6;  // 친구 관리 명령어 결과
    MailProvided mail_provided = 7;    // 우편함 갱신 - 게임 서버(Unity)가 특정 클라한테 전달
  }
}

// 내용 없이 메시지가 왔다는 사실 자체가 생존 신호다.
message GameAgentHeartbeat {}

// 마스터가 매치를 배정했을 때 게임 에이전트가 게임 서버에 방을 열라고 요청한다.
// 게임 서버는 방을 열고 RoomOpened로 응답해야 한다.
// 게임 에이전트는 RoomOpened를 받기 전까지 마스터에 완료 보고를 하지 않는다.
message OpenRoom {
  string room_id = 1;             // 마스터가 배정한 방 ID
  repeated string player_ids = 2; // 입장할 플레이어 목록
  int64 timestamp_unix_ms = 3;
  GameType game_type = 4;         // 인게임 서버가 이 값으로 방 종류(Room 파생 클래스)를 결정한다
}

// 마스터의 드레인 신호를 게임 서버에 릴레이한다.
// 게임 서버는 진행 중인 매치를 마무리하고 신규 매치를 받지 않아야 한다.
message DrainSignal {
  bool stop_accepting_new = 1;
}

// ApprovalRequest에 대한 게임 에이전트의 검증 결과.
// approved = true면 게임 서버가 NGO 접속을 승인한다.
message ApprovalResponse {
  uint64 client_id = 1;      // 어떤 클라이언트에 대한 응답인지
  string player_id = 2;     // 검증된 플레이어 ID
  bool approved = 3;        // 승인 여부
  string reason = 4;        // approved = false인 경우 거부 사유
  string new_token = 5;     // approved = true일 때 - 게임 에이전트가 권한을 넘겨받으면서
                             // 새로 발급한 토큰. "갱신 권한은 OwnerServerId를 가진 서버만"
                             // 원칙에 따라, 지금 권한을 넘겨받은 게임 에이전트가 발급한다.
                             // 클라는 이 값으로 캐시된 토큰을 갱신해야 한다.
}

// 매칭 서버가 이미 요청했던 방을 취소했을 때, 게임 에이전트가 게임 서버에 전달한다.
// 게임 서버(RoomManager)는 방을 제거하고, 이미 NGO로 접속해있던 클라가 있으면
// redirects에 있는 대로 리다이렉트 정보를 실어 끊는다 - redirects에 없는 클라(리다이렉트할
// 곳을 못 찾은 경우)는 그냥 끊는다.
message CloseRoom {
  string room_id = 1;
  string reason = 2;
  repeated PlayerRedirect redirects = 3;
}

// 리다이렉트 대상 플레이어와 그 목적지 로비 주소.
message PlayerRedirect {
  string player_id = 1;
  string lobby_address = 2;
  string transfer_ticket = 3; // EnterLobby 제출용 일회용 임시 티켓
}

// 인게임 서버가 방을 열었는데 일정 시간 안에 ExpectedPlayerIds 전원이 접속하지 않으면
// (게임 서버 자체 타임아웃) 게임 에이전트에 이걸 보고한다. 게임 에이전트는 CancelRoomAsync와
// 동일한 처리(로비 주소 조회 → 세션 이전 → CloseRoom)를 그대로 재사용한다.
message RoomTimeout {
  string room_id = 1;
}

message FriendCommandResponse {
  uint64 client_id = 1;
  oneof result {
    GetFriendsResult get_friends = 2;
    AddFriendResult add_friend = 3;
    RemoveFriendResult remove_friend = 4;
  }
}

// 인게임 서버(Unity)가 NGO 접속 완료 시 클라한테 조건 없이 보내는 메시지 - 예전엔
// "새 토큰이 있을 때만" 보내는 TokenUpdate였는데, 재접속 가능 여부도 매번 알려줘야
// 해서 의미를 넓힘(KNOWN_ISSUES.md 참고). 이것도 gRPC로 안 나가고 NGO
// CustomMessagingManager로만 릴레이되는 메시지 - FriendCommandResponse와 같은 용도.
message ConnectionWelcome {
  string new_token = 1;      // 재발급 없었으면 빈 문자열
  bool allow_reconnect = 2;  // 이 방이 재접속 가능한 타입인지 - 클라가 끊겼을 때
                              // 로그인 서버를 거치지 않고 바로 이 주소로 재시도할 수
                              // 있는지 판단하는 데 씀
}

message GetFriendsResult {
  repeated string friend_player_ids = 1;
}

message AddFriendResult {
  bool success = 1;
  string error_message = 2;
}

message RemoveFriendResult {
  bool success = 1;
  string error_message = 2;
}

message MailProvided {
  string player_id = 1;  // 어느 클라인지 - 게임 서버(Unity)가 clientId로 매핑하는 데 씀
  repeated MailInfo mails = 2;
}

message MailInfo {
  string mail_id = 1;
  MailType mail_type = 2;
  string display_content = 3;
  int64 created_at_unix_ms = 4;
  int64 expires_at_unix_ms = 5;
  bool claimed = 6;
}
