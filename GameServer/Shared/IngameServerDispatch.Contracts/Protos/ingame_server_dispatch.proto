syntax = "proto3";

import "ingame.proto";
import "master.proto";

option csharp_namespace = "IngameServerDispatch";

// 네트워크로 나가지 않는 순수 메시지 정의 - Unity 게임 서버(IngameServerInstance) 내부에서
// 백그라운드 스레드(GrpcIngameServerChannel의 gRPC 수신 루프, 비동기 대기 완료 시점 등)가
// 메인 스레드로 이벤트를 넘길 때만 쓰는 태그드 유니언. gRPC 서비스 없음(RPC 대상 아님).
// 클라(Client/)용 ClientDispatchEvent와는 완전히 별도 - 배포 시 클라/서버 바이너리가
// 분리되므로, 하나로 합쳐두면 서버 내부 이벤트 구조를 클라 빌드에서 추측할 여지를 준다고
// 판단.
//
// redirect_disconnect/approval_resolved는 원래 IngameServerInstance.cs 안에 파묻혀있던
// 자체 큐(_workResults, ClientWorkResult) - 이 디스패처와 정확히 같은 목적으로 예전부터
// 따로 존재했던 걸 발견해서 통합함(KNOWN_ISSUES.md 참고).
message IngameServerDispatchEvent {
  oneof payload {
    MailProvided mail_provided = 1;
    FriendCommandResponse friend_command_result = 2;

    // 리다이렉트(방 정상 종료로 인한 이동)로 클라를 끊어야 한다는 결정 - RoomClosed
    // 확인 응답을 기다리는 비동기 작업이 끝난 시점(성공이든 타임아웃이든)에 발생.
    ClientRedirectDisconnect redirect_disconnect = 3;

    // 게임 에이전트가 ConnectionApproval 승인/거부를 결정한 결과.
    ClientApprovalResolved approval_resolved = 4;

    // 게임 에이전트가 방 열기를 요청함 - work_id로 나중에 CompleteWork 응답을 짝지어야
    // 하므로 Guid를 문자열로 담는다(protobuf 기본 스칼라가 아님).
    ClientOpenRoomWork open_room_work = 5;

    // 게임 에이전트가 방 취소/제거를 요청함 - 필드가 원본과 1:1 대응이라 별도 변환 없이
    // 그대로 재사용(CloseRoomInfo/PlayerRedirectInfo DTO는 완전히 제거).
    CloseRoom close_room = 6;

    // 게임 에이전트가 신규 접속 중단(Drain) 신호를 보냄. 지금은 로그만 남기는 게 실제
    // 처리 전부라 위험은 없지만(Debug.Log는 스레드 안전), Drain 업무 자체가 아직
    // 미구현이라 실제 로직이 생기면 이 배선이 필요해질 것이므로 미리 갖춰둔다.
    ClientDrainSignal drain_signal = 7;

    // 마스터의 공지 지시 릴레이 - MasterServer.AnnouncementTask 그대로 재사용(active 포함).
    AnnouncementTask announcement = 8;
  }
}

message ClientDrainSignal {
  bool stop_accepting_new = 1;
}

message ClientOpenRoomWork {
  string work_id = 1;
  OpenRoom request = 2;
}

message ClientRedirectDisconnect {
  uint64 client_id = 1;
}

message ClientApprovalResolved {
  uint64 client_id = 1;
  bool approved = 2;
  string reason = 3;
  string new_token = 4;
}
