syntax = "proto3";

option csharp_namespace = "GameServer.Common";

// 여러 서비스에서 공통으로 사용하는 타입을 정의한다.
// master.proto, matching.proto 등에서 임포트한다.

enum ServerType {
  SERVER_TYPE_UNSPECIFIED = 0;
  LOBBY = 1;
  INGAME = 2;
  CHAT = 3;
  MATCHING = 4;
  LOGIN = 5;    // 클라 최초 접속 전용 서버 - 로그인 성공 후 손을 떼면 다시 안 옴
  ACCOUNT = 6;  // 계정 정보(ID/비번 등) 저장소. 로그인 서버만 상대한다.
  SUB_SERVER = 7;  // 결제/보상/광고 등 비동기 이벤트를 처리하는 백엔드 워커
                    // (DummySubServer 등). 우편함 시스템 도입으로 세션 레지스트리
                    // 조회 + 특정 메인 서버 호출이 필요해져서 마스터에 정식으로
                    // 등록하게 됨.
}

// 매치/방의 게임 모드. 로비→매칭→게임 에이전트→인게임 서버까지 전체 파이프라인을
// 관통해서 전달된다 - 매칭(대기열 분리), 인게임(재접속 정책 등 룰) 양쪽에서 다 필요하다.
//
// NONE/DELETED를 미리 넣어두는 이유: 서버들이 전부 계획대로 롤링 재시작되지 않은 채로
// 배포가 섞이는 경우(구버전 서버가 신버전이 보낸 값을 모르는 경우 등)를 대비한 것.
// 그런 경우 GAME_TYPE_UNSPECIFIED(필드를 아예 안 채운 경우의 proto3 기본값)로 떨어지거나,
// 이 서버가 모르는 값(신규 모드 등)을 만나면, 인게임 서버가 "지원 안 하는 모드"로 명시적
// 거부(GameErrorCode.UnsupportedGameType)할 수 있게 하기 위함이다 - 조용히 잘못 처리하거나
// 크래시하는 대신.
enum GameType {
  GAME_TYPE_UNSPECIFIED = 0;  // 필드를 아예 안 채운 경우 (구버전 클라/서버 호환)
  NONE = 1;                   // 의도적으로 "게임 모드 없음" (로비 컨텍스트 등)
  NORMAL = 2;
  DELETED = 3;                // 폐지된 모드 - 만나면 명시적으로 거부해야 함
}

// 우편함 상한선 초과 시 밀어내기 정책(수령됨 > 만료됨 > 오래된 것 순)에서, 아직
// 미수령/미만료 상태로 밀려나야 하는 우편을 어떻게 처리할지 이 타입으로 판단한다 -
// ItemProvision(보상 - 점검/장애/이벤트 보상 등 전부 통합, 유저가 받아서 손해가
// 없음)은 밀려나기 전에 자동으로 수령 처리하고, 그 외(GuildInvite처럼 수락이 실제
// 결정이라 이득이 불분명한 것)는 그냥 삭제(거부)한다 - AccountServer의 밀어내기
// 함수(TODO.md/KNOWN_ISSUES.md 참고)가 이 판단 기준으로 쓴다.
enum MailType {
  MAIL_TYPE_UNSPECIFIED = 0; // 알 수 없는 타입 - 안전하게 "거부" 취급
  ITEM_PROVISION = 1;        // 보상 통합(점검/장애/이벤트 보상 등 세부 사유는 display_content로 구분)
  GUILD_INVITE = 2;          // 예시 - 수락이 실제 결정이라 이득이 불분명함
}

// 서버 공지 - 자유 문구 대신 열거형 값 하나로 퉁친다. 마스터→각 메인 서버→전체 클라
// 브로드캐스트 경로 전체(패킷 양이 상당함)에서 문자열 대신 정수 하나만 오가게 하기
// 위함 - 클라가 이 값을 받아서 자기 언어/문구로 알아서 해석해서 표시한다.
enum AnnouncementType {
  ANNOUNCEMENT_TYPE_UNSPECIFIED = 0;
  SERVER_SHUTDOWN_SOON = 1; // 예시 - "N분 뒤 서버가 종료됩니다"
}

// ===================== 실패 사유 / 결과 enum 규칙 =====================
// 사람이 읽는 문장(특정 언어) 대신 값 하나만 오가고, 클라가 자기 언어로 바꿔 표시한다
// (위 AnnouncementType과 같은 방식 - Unity의 EnumToScreenText 표 참고).
// - 0번은 항상 *_UNSPECIFIED(값을 안 채운 것) - 빈 값이 성공이나 특정 사유로 오해되지 않게.
// - 성공/실패를 함께 담는 응답은 결과 enum 하나(OK 포함), 실패 전용 메시지는 사유 enum만 둔다.
// - proto 파일들에 package가 없어서 enum 값 이름이 프로젝트 전체에서 겹치면 안 된다 - 값마다 enum
//   이름을 접두어로 붙인다(C# 생성 코드에선 접두어가 빠져 MatchFailReason.Timeout처럼 보인다).
// - 값은 뒤에 추가만 한다. 번호를 바꾸거나 지운 번호를 재사용하지 않는다 - NGO 접속 거부 사유처럼
//   숫자로 오가는 곳이 있다(ApprovalDecision 참고).
// - 동적인 값(주소 등)은 별도 필드로 둔다. detail은 로그/디버그용 설명이고 화면에 표시하지 않는다.

// 매칭 실패 사유 - 매칭 서버(MatchCancelled) → 로비 → 클라(MatchFailed)로 그대로 전달된다.
enum MatchFailReason {
  MATCH_FAIL_REASON_UNSPECIFIED = 0;
  MATCH_FAIL_REASON_TIMEOUT = 1;                       // 제한 시간 안에 매치가 안 잡힘
  MATCH_FAIL_REASON_MATCHING_SERVER_DISCONNECTED = 2;  // 로비와 매칭 서버의 연결이 끊김
  MATCH_FAIL_REASON_PLAYER_ID_MISSING = 3;             // 인증 정보에 playerId가 없음
  MATCH_FAIL_REASON_NOT_OWNED_BY_THIS_SERVER = 4;      // 이 로비가 소유한 세션이 아님
  MATCH_FAIL_REASON_UNSUPPORTED_GAME_TYPE = 5;         // 매칭 규칙이 없는 GameType(Unspecified/None/Deleted 포함)
  MATCH_FAIL_REASON_ALREADY_QUEUED = 6;                // 이미 대기열에 있음
  MATCH_FAIL_REASON_MATCHING_SERVER_UNAVAILABLE = 7;   // 로비가 매칭 서버 주소를 모르거나 JoinMatch 호출이 실패
}

// 친구 추가/삭제 결과 - 계정 서버 → 로비/게임 에이전트 → 클라로 그대로 전달된다.
enum FriendResult {
  FRIEND_RESULT_UNSPECIFIED = 0;
  FRIEND_RESULT_OK = 1;
  FRIEND_RESULT_MISSING_CREDENTIALS = 2;         // 인증 정보 없음
  FRIEND_RESULT_ACCOUNT_NOT_FOUND = 3;           // 계정(자기 또는 상대)을 찾을 수 없음
  FRIEND_RESULT_TEMPORARY_FAILURE = 4;           // 일시적 오류(계정 서버 호출 실패 등) - 잠시 후 재시도
  FRIEND_RESULT_ACCOUNT_SERVER_UNAVAILABLE = 5;  // 계정 서버 주소를 아직 모름(마스터에게 못 받음)
}
