syntax = "proto3";

option csharp_namespace = "GameServer.Common";

// 여러 서비스에서 공통으로 사용하는 타입을 정의한다.
// master.proto, matching.proto 등에서 임포트한다.

enum ServerType {
  SERVER_TYPE_UNSPECIFIED = 0;
  LOBBY = 1;
  INGAME = 2;
  CHAT = 3;
  MATCHING = 4;
  LOGIN = 5;    // 클라 최초 접속 전용 서버 - 로그인 성공 후 손을 떼면 다시 안 옴
  ACCOUNT = 6;  // 계정 정보(ID/비번 등) 저장소. 로그인 서버만 상대한다.
  SUB_SERVER = 7;  // 결제/보상/광고 등 비동기 이벤트를 처리하는 백엔드 워커
                    // (DummySubServer 등). 우편함 시스템 도입으로 세션 레지스트리
                    // 조회 + 특정 메인 서버 호출이 필요해져서 마스터에 정식으로
                    // 등록하게 됨.
}

// 매치/방의 게임 모드. 로비→매칭→게임 에이전트→인게임 서버까지 전체 파이프라인을
// 관통해서 전달된다 - 매칭(대기열 분리), 인게임(재접속 정책 등 룰) 양쪽에서 다 필요하다.
//
// NONE/DELETED를 미리 넣어두는 이유: 서버들이 전부 계획대로 롤링 재시작되지 않은 채로
// 배포가 섞이는 경우(구버전 서버가 신버전이 보낸 값을 모르는 경우 등)를 대비한 것.
// 그런 경우 GAME_TYPE_UNSPECIFIED(필드를 아예 안 채운 경우의 proto3 기본값)로 떨어지거나,
// 이 서버가 모르는 값(신규 모드 등)을 만나면, 인게임 서버가 "지원 안 하는 모드"로 명시적
// 거부(GameErrorCode.UnsupportedGameType)할 수 있게 하기 위함이다 - 조용히 잘못 처리하거나
// 크래시하는 대신.
enum GameType {
  GAME_TYPE_UNSPECIFIED = 0;  // 필드를 아예 안 채운 경우 (구버전 클라/서버 호환)
  NONE = 1;                   // 의도적으로 "게임 모드 없음" (로비 컨텍스트 등)
  NORMAL = 2;
  DELETED = 3;                // 폐지된 모드 - 만나면 명시적으로 거부해야 함
}
