syntax = "proto3";

import "common.proto";

option csharp_namespace = "MatchingServer";

// 매칭 서버와 로비/게임 에이전트 간 통신 계약.
// 매칭 서버는 범용 라우팅/매칭 엔진으로 플레이어 풀과 서버 풀을 관리한다.
//
// 서비스:
//   MatchConnectionControl ← 로비/게임 에이전트가 매칭 서버에 접속을 유지하는 양방향 스트림.
//                            등록/생존 감지/매칭 서버→로비 알림(NotifyMatch)을 전부 이걸로 처리한다.
//                            (MasterServer의 Connect 패턴과 동일 - 스트림이 끊기면 즉시 서버 풀에서
//                            제거되므로, 예전처럼 RegisterServer/UnregisterServer 단발 호출 + Redis
//                            TTL 폴링에 기대지 않아도 된다.)
//   LobbyMatchControl      ← 로비 서버 → 매칭 서버 (요청-응답이 필요한 것만 단항으로 유지)
//   IngameMatchControl     ← 게임 에이전트 ↔ 매칭 서버 (요청-응답이 필요한 것만 단항으로 유지)

// ==========================================
// 접속 유지 (로비/게임 에이전트 → 매칭 서버)
// ==========================================

service MatchConnectionControl {
  rpc Connect(stream ServerToMatchMessage) returns (stream MatchToServerMessage);
}

message ServerToMatchMessage {
  oneof payload {
    MatchConnectionHeartbeat heartbeat = 1;
    MatchConnectionStatus status = 2;  // 최초 접속 시 1회 - 등록을 대체한다
  }
}

message MatchConnectionStatus {
  string server_id = 1;
  ServerType server_type = 2;   // Lobby 또는 Ingame
  string address = 3;           // 매칭 서버가 필요 시 콜백/조회에 쓸 주소
}

message MatchConnectionHeartbeat {}

message MatchToServerMessage {
  oneof payload {
    MatchConnectionHeartbeat heartbeat = 1;
    MatchNotification match_notification = 2;  // 로비 전용 - 매칭 확정/취소 통보
  }
}

// 매칭 서버 → 로비 서버 결과 통보 (위 스트림에 실어 보낸다. 응답 불필요 - 알림성이라 fire-and-forget)
message MatchNotification {
  oneof result {
    MatchConfirmed confirmed = 1;
    MatchCancelled cancelled = 2;
  }
}

message MatchConfirmed {
  string player_id = 1;
  string ingame_server_id = 2;   // 접속할 게임 에이전트 ID (OwnerServerId 설정에 사용)
  string ingame_address = 3;     // 클라가 접속할 게임 서버 주소
}

message MatchCancelled {
  string player_id = 1;
  MatchFailReason reason = 2;  // 취소 사유(common.proto) - 로비가 MatchFailed로 그대로 클라에 전달한다
  string detail = 3;           // 로그/디버그용 설명
}

// =====================
// 로비 서버 → 매칭 서버
// =====================

service LobbyMatchControl {
  // 로비 서버 → 매칭 서버: 플레이어 매칭 요청
  rpc JoinMatch(JoinMatchRequest) returns (JoinMatchResponse);

  // 로비 서버 → 매칭 서버: 플레이어 매칭 취소
  rpc LeaveMatch(LeaveMatchRequest) returns (LeaveMatchResponse);
}

message JoinMatchRequest {
  string player_id = 1;
  string lobby_server_id = 2;  // 결과를 어느 로비에 통보할지 (MatchConnectionStatus로 등록한 server_id)
  int32 skill_score = 3;       // 더미: 추후 실력 기반 매칭 구현 시 사용
  GameType game_type = 4;      // 어느 대기열에 넣을지 - 같은 game_type끼리만 매칭돼야 한다
}

message JoinMatchResponse {
  bool success = 1;
  reserved 2;                 // 예전 string error_message - 사유는 reason 열거형으로 대체
  MatchFailReason reason = 3; // success=false일 때 - 로비가 클라에 MatchFailed로 그대로 전달 (common.proto)
  string detail = 4;          // 로그/디버그용 설명
}

message LeaveMatchRequest {
  string player_id = 1;
}

message LeaveMatchResponse {
  bool success = 1;
  string error_message = 2;
}

// ==========================
// 게임 에이전트 ↔ 매칭 서버
// ==========================

service IngameMatchControl {
  // 매칭 서버 → 게임 에이전트: 매치 준비 요청
  rpc PrepareMatch(PrepareMatchRequest) returns (PrepareMatchResponse);

  // 게임 에이전트 → 매칭 서버: 매치 준비 결과
  rpc PrepareMatchResult(PrepareMatchResultRequest) returns (PrepareMatchResultResponse);

  // 매칭 서버 → 게임 에이전트: 이미 요청했던 방을 취소한다.
  // (PrepareMatch가 수락된 이후 - 즉 게임 에이전트가 실제로 게임 서버에 방 생성을 요청한
  // 이후 - 클라/로비 접속이 끊기는 등으로 매치가 중단되면 호출한다.)
  rpc CancelRoom(CancelRoomRequest) returns (CancelRoomResponse);

  // 게임 에이전트 → 매칭 서버: 방이 취소/제거될 때, 그 방에 있던 클라들을 보낼 로비 주소를
  // 요청한다. 어느 로비든 상관없으므로(로비는 서로 대체 가능) 특정 로비를 지정하지 않고
  // "지금 접속 중인 로비 아무거나" 요청하는 형태다.
  rpc RequestLobbyAddress(RequestLobbyAddressRequest) returns (RequestLobbyAddressResponse);
}

message CancelRoomRequest {
  string match_id = 1;
  string reason = 2;
}

message CancelRoomResponse {
  bool acknowledged = 1;
}

message RequestLobbyAddressRequest {}

message RequestLobbyAddressResponse {
  bool found = 1;
  string lobby_server_id = 2;
  string address = 3;
}

message PrepareMatchRequest {
  string match_id = 1;
  repeated string player_ids = 2;  // 이 방에 들어올 플레이어 목록
  GameType game_type = 3;          // 인게임 서버가 방 준비 시 룰(재접속 정책 등) 결정에 사용
}

message PrepareMatchResponse {
  bool accepted = 1;  // 준비 가능 여부 (수용 가능 여부 즉시 응답)
  string error_message = 2;
}

message PrepareMatchResultRequest {
  string match_id = 1;
  bool success = 2;
  string error_message = 3;  // 실패 시 사유
  string ingame_address = 4; // success = true일 때 - 클라이언트가 NGO로 접속할 실제 주소
                              // (게임 에이전트 자신의 gRPC 주소와 다름. ServerReady로 이미
                              // 게임 에이전트가 받아둔 값을 그대로 실어보낸다.)
}

message PrepareMatchResultResponse {
  bool acknowledged = 1;
}
