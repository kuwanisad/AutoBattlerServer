syntax = "proto3";

option csharp_namespace = "CleanupServerContracts";

// 메인 서버(로비, 게임 에이전트 등)가 RegistryCleanupServer에 직접 통신하는 단방향 RPC.
// 마스터 서버를 거치지 않는다.
// ServerType은 포함하지 않는다. RegistryCleanupServer는 서버 ID만으로 명부를 관리한다.
//
// 관리 대상은 oneof object로 확장 가능하다.
// 현재는 PlayerObject만 있지만 추후 RoomObject, GuildObject 등 추가 예정.

service MainServerCleanupConnection {
  // 관리 대상을 명부에 등록한다.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // 관리 대상을 명부에서 해제한다.
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);

  // 관리 대상들의 소유권을 다른 서버로 이전한다.
  // to_server_id가 GraveList에 있으면 거부한다.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);

  // 서버 정상 종료 시 호출한다.
  // 명부에서 해당 서버를 제거한다. 마스터 서버의 잔업 처리가 불필요해진다.
  rpc NotifyShutdown(ShutdownNoticeRequest) returns (ShutdownNoticeResponse);
}

// === 관리 대상 객체 ===

message PlayerObject {
  string player_id = 1;
}

// 추후 추가 예정
// message RoomObject { ... }
// message GuildObject { ... }

// === RPC 메시지 ===

message RegisterRequest {
  string server_id = 1;
  oneof object {
    PlayerObject player = 2;
  }
}

message RegisterResponse {
  bool success = 1;
  string error_message = 2;
}

message UnregisterRequest {
  string server_id = 1;
  oneof object {
    PlayerObject player = 2;
  }
}

message UnregisterResponse {
  bool success = 1;
  string error_message = 2;
}

message TransferOwnershipRequest {
  string from_server_id = 1;
  string to_server_id = 2;
  repeated string object_ids = 3;
}

message TransferOwnershipResponse {
  bool success = 1;
  string error_message = 2;  // to_server_id가 GraveList에 있으면 거부 사유 포함
}

message ShutdownNoticeRequest {
  string server_id = 1;
}

message ShutdownNoticeResponse {
  bool success = 1;
  int32 removed_count = 2;
}
