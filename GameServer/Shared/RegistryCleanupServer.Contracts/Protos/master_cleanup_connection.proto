syntax = "proto3";

option csharp_namespace = "CleanupServerContracts";

// 마스터 서버와 RegistryCleanupServer 간 양방향 스트림.
// RegistryCleanupServer가 gRPC 서버, 마스터 서버가 gRPC 클라이언트다.
//
// 마스터 서버는 하트비트 타임아웃 또는 비정상 연결 종료로 메인 서버 죽음을 감지하면
// ServerDiedNotice를 보내 RegistryCleanupServer가 잔업을 처리하도록 한다.
// 정상 종료(ShutdownNotice 수신 후 연결 종료)는 통보하지 않는다.

service MasterCleanupConnection {
  rpc Connect(stream MasterCleanupMessage) returns (stream CleanupServerMessage);
}

// === 마스터 서버 → RegistryCleanupServer ===

message MasterCleanupMessage {
  oneof payload {
    MasterCleanupHeartbeat heartbeat = 1;
    ServerDiedNotice server_died = 2;  // 메인 서버 비정상 종료 통보
  }
}

message MasterCleanupHeartbeat {}

// 마스터 서버가 비정상 종료를 감지했을 때 전송한다.
// ShutdownNotice 없이 연결이 끊긴 경우에만 전송한다.
message ServerDiedNotice {
  string server_id = 1;
  int64 detected_at_unix_ms = 2;
}

// === RegistryCleanupServer → 마스터 서버 ===

message CleanupServerMessage {
  oneof payload {
    CleanupServerHeartbeat heartbeat = 1;
    CleanupServerReady ready = 2;      // 준비 완료 보고
    CleanupCompleted completed = 3;    // 잔업 완료 보고
  }
}

message CleanupServerHeartbeat {}

message CleanupServerReady {
  int64 timestamp_unix_ms = 1;
}

// 잔업 처리 완료를 마스터 서버에 보고한다.
message CleanupCompleted {
  string server_id = 1;
  int32 cleaned_object_count = 2;
  int64 completed_at_unix_ms = 3;
  bool success = 4;
  string error_message = 5;
}
