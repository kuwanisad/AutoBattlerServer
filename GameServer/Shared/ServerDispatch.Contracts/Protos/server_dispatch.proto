syntax = "proto3";

import "ingame.proto";

option csharp_namespace = "ServerDispatch";

// 네트워크로 나가지 않는 순수 메시지 정의 - Unity 게임 서버(IngameServerInstance) 내부에서
// 백그라운드 스레드(GrpcIngameServerChannel의 gRPC 수신 루프)가 메인 스레드로 이벤트를
// 넘길 때만 쓰는 태그드 유니언. gRPC 서비스 없음(RPC 대상 아님). 클라(Client/)용
// ClientDispatchEvent와는 완전히 별도 - 배포 시 클라/서버 바이너리가 분리되므로,
// 하나로 합쳐두면 서버 내부 이벤트 구조를 클라 빌드에서 추측할 여지를 준다고 판단.
message ServerDispatchEvent {
  oneof payload {
    MailProvided mail_provided = 1;
    // 앞으로 다른 서버 이벤트(ApprovalResult, CloseRoomInfo 등)가 이 디스패처를
    // 거치게 되면 여기 추가.
  }
}
